# Runs the automated tests on every push to main and on pull requests.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:          # reused by release.yml before building

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - run: python -m pytest tests -q
